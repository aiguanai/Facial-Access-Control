services:
  # ============================================
  # INFRASTRUCTURE
  # ============================================

  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: faceauth
      POSTGRES_USER: faceauth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faceauth"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources

  # ============================================
  # MICROSERVICES
  # ============================================

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      KAFKA_BROKER: kafka:9092
      AUTH_ORCHESTRATION_URL: http://auth-orchestration:3001
      PROFILE_SERVICE_URL: http://profile-service:3002
      MEDIA_SERVICE_URL: http://media-service:3003
      FACE_MATCHING_URL: http://face-matching:3004
      LIVENESS_SERVICE_URL: http://liveness-service:3005
      BEHAVIOURAL_SERVICE_URL: http://behavioural-service:3006
      RISK_ENGINE_URL: http://risk-engine:3007
      MFA_SERVICE_URL: http://mfa-service:3008
      SESSION_SERVICE_URL: http://session-service:3009
      AUDIT_SERVICE_URL: http://audit-service:3011
      ANALYTICS_SERVICE_URL: http://analytics-service:3012
      ALLOWED_ORIGINS: http://localhost:3080,http://frontend:3080
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  auth-orchestration:
    build: ./services/auth-orchestration
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgres://faceauth:${POSTGRES_PASSWORD:-changeme}@postgres:5432/faceauth
      REDIS_URL: redis://redis:6379
      KAFKA_BROKER: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  profile-service:
    build: ./services/profile-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DATABASE_URL: postgres://faceauth:${POSTGRES_PASSWORD:-changeme}@postgres:5432/faceauth
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  media-service:
    build: ./services/media-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  face-matching:
    build: ./services/face-matching
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DATABASE_URL: postgres://faceauth:${POSTGRES_PASSWORD:-changeme}@postgres:5432/faceauth
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  liveness-service:
    build: ./services/liveness-service
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  behavioural-service:
    build: ./services/behavioural-service
    ports:
      - "3006:3006"
    environment:
      PORT: 3006
      DATABASE_URL: postgres://faceauth:${POSTGRES_PASSWORD:-changeme}@postgres:5432/faceauth
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  risk-engine:
    build: ./services/risk-engine
    ports:
      - "3007:3007"
    environment:
      PORT: 3007
      DATABASE_URL: postgres://faceauth:${POSTGRES_PASSWORD:-changeme}@postgres:5432/faceauth
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3007/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mfa-service:
    build: ./services/mfa-service
    ports:
      - "3008:3008"
    environment:
      PORT: 3008
      DATABASE_URL: postgres://faceauth:${POSTGRES_PASSWORD:-changeme}@postgres:5432/faceauth
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3008/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  session-service:
    build: ./services/session-service
    ports:
      - "3009:3009"
    environment:
      PORT: 3009
      DATABASE_URL: postgres://faceauth:${POSTGRES_PASSWORD:-changeme}@postgres:5432/faceauth
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3009/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  audit-service:
    build: ./services/audit-service
    ports:
      - "3011:3011"
    environment:
      PORT: 3011
      DATABASE_URL: postgres://faceauth:${POSTGRES_PASSWORD:-changeme}@postgres:5432/faceauth
      KAFKA_BROKER: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3011/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  analytics-service:
    build: ./services/analytics-service
    ports:
      - "3012:3012"
    environment:
      PORT: 3012
      DATABASE_URL: postgres://faceauth:${POSTGRES_PASSWORD:-changeme}@postgres:5432/faceauth
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3012/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3080:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: faceauth-network
