apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: faceauth-ingress
  namespace: faceauth
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - faceauth.example.com
    secretName: faceauth-tls
  rules:
  - host: faceauth.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway-service
            port:
              number: 80

