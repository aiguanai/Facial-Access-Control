apiVersion: apps/v1
kind: Deployment
metadata:
  name: face-matching
  namespace: faceauth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: face-matching
  template:
    metadata:
      labels:
        app: face-matching
    spec:
      containers:
      - name: face-matching
        image: faceauth/face-matching:latest
        ports:
        - containerPort: 3004
        envFrom:
        - configMapRef:
            name: app-config
        - name: PORT
          value: "3004"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
            nvidia.com/gpu: 1
          limits:
            memory: "4Gi"
            cpu: "2000m"
            nvidia.com/gpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: face-matching-service
  namespace: faceauth
spec:
  selector:
    app: face-matching
  ports:
  - port: 3004
    targetPort: 3004

