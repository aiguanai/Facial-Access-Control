apiVersion: apps/v1
kind: Deployment
metadata:
  name: liveness-service
  namespace: faceauth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: liveness-service
  template:
    metadata:
      labels:
        app: liveness-service
    spec:
      containers:
      - name: liveness-service
        image: faceauth/liveness-service:latest
        ports:
        - containerPort: 3005
        envFrom:
        - configMapRef:
            name: app-config
        - name: PORT
          value: "3005"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
            nvidia.com/gpu: 1
          limits:
            memory: "4Gi"
            cpu: "2000m"
            nvidia.com/gpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: liveness-service
  namespace: faceauth
spec:
  selector:
    app: liveness-service
  ports:
  - port: 3005
    targetPort: 3005

