apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: faceauth
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: faceauth/api-gateway:latest
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: AUTH_ORCHESTRATION_URL
          value: "http://auth-orchestration-service:3001"
        - name: PROFILE_SERVICE_URL
          value: "http://profile-service:3002"
        - name: MEDIA_SERVICE_URL
          value: "http://media-service:3003"
        - name: FACE_MATCHING_URL
          value: "http://face-matching-service:3004"
        - name: LIVENESS_SERVICE_URL
          value: "http://liveness-service:3005"
        - name: BEHAVIOURAL_SERVICE_URL
          value: "http://behavioural-service:3006"
        - name: RISK_ENGINE_URL
          value: "http://risk-engine-service:3007"
        - name: MFA_SERVICE_URL
          value: "http://mfa-service:3008"
        - name: SESSION_SERVICE_URL
          value: "http://session-service:3009"
        - name: AUDIT_SERVICE_URL
          value: "http://audit-service:3011"
        - name: ANALYTICS_SERVICE_URL
          value: "http://analytics-service:3012"
        - name: KAFKA_BROKER
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KAFKA_BROKER
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: faceauth
spec:
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer

