apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: faceauth
data:
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "faceauth"
  DB_USER: "faceauth"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  KAFKA_BROKER: "kafka-service:9092"
  MINIO_ENDPOINT: "minio-service"
  MINIO_PORT: "9000"
  MINIO_BUCKET: "faceauth-media"
  LOG_LEVEL: "info"

